<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raketti</title>
  <style>
    html, body {margin: 0; height: 100%;
    background: #2b2626; color: #dcd7d2; font-family: monospace; }
    #status { position: absolute; inset: 0;
    display: grid; place-items: center; margin: 0; }
    </style>
</head>
<body>
    <p id="status">Loading Raketti...</p>
    <script src="wasm_exec.js"></script>
<script>
      const go = new Go();
      WebAssembly.instantiateStreaming(fetch("raketti.wasm"), go.importObject)
    .then(result => {
    document.getElementById("status").remove();
    go.run(result.instance);
    })
    .catch(err => {

    document.getElementById("status").textContent = "Could not start the game: " + err;
    })
</script>
  </body>
</html>
